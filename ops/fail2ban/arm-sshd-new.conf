# Extends the installed Fail2Ban iptables action, including its IPv6 handling.
# Ban only NEW SSH connections; never cut off established administrative sessions.
[INCLUDES]
before = iptables.conf

[Definition]
type = multiport
_ipt_chain_rule = -p tcp --syn -m conntrack --ctstate NEW -m multiport --dports <port> <rule-jump>

[Init]
name = arm-sshd
port = 22
protocol = tcp
chain = INPUT
