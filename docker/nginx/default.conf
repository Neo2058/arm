server {
    listen 80;
    server_name тч-15.рф www.тч-15.рф 83.220.173.171 _;
    index index.php index.html;
    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets (images, css, js) for fast loading on repeat visits
    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Make Laravel think the request came over HTTP (prevents redirect to HTTPS)
        fastcgi_param HTTPS off;
    }
}
