# =============================================
# HTTP server (currently primary while no SSL certs)
# Serves the Laravel app directly. Required for Livewire/Filament file uploads to work.
# When you add SSL certs, you can re-enable redirect or use 443.
# =============================================
server {
    listen 80;
    server_name тч-15.рф www.тч-15.рф xn---15-7edz.xn--p1ai www.xn---15-7edz.xn--p1ai;

    # IMPORTANT for file uploads (Livewire POSTs with files)
    client_max_body_size 100M;

    index index.php index.html;
    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets (images, css, js) for fast loading
    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP handling - Livewire uploads go through here via /livewire/update
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Running over HTTP for now
        fastcgi_param HTTPS off;

        # Help with large uploads / long processing
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }
}

# =============================================
# HTTPS (ready for when you add certificates)
# Mount certs into ./ssl/fullchain.pem + privkey.pem
# =============================================
server {
    listen 443 ssl http2;
    server_name тч-15.рф www.тч-15.рф xn---15-7edz.xn--p1ai www.xn---15-7edz.xn--p1ai;

    # Пути к сертификату
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # IMPORTANT for file uploads
    client_max_body_size 100M;

    index index.php index.html;
    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets
    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Laravel knows it's HTTPS
        fastcgi_param HTTPS on;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }
}
