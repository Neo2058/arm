# =============================================
# HTTP → HTTPS redirect (always active)
# =============================================
server {
    listen 80 default_server;
    server_name _ тч-15.рф www.тч-15.рф xn---15-7edz.xn--p1ai www.xn---15-7edz.xn--p1ai;

    # Перенаправляем голый домен на www
    if ($host = xn---15-7edz.xn--p1ai) {
        return 301 https://www.xn---15-7edz.xn--p1ai$request_uri;
    }

    # Остальные запросы — на HTTPS того же хоста
    return 301 https://$host$request_uri;
}

# =============================================
# HTTPS server (primary)
# =============================================
server {
    listen 443 ssl;
    http2 on;
    server_name www.xn---15-7edz.xn--p1ai;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Critical for Livewire / Filament file uploads (large POST bodies + snapshots)
    client_max_body_size 100M;

    # Reduce "buffered to a temporary file" warnings and potential oddities with large Livewire payloads
    client_body_buffer_size 16M;

    index index.php index.html;
    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets (images, css, js)
    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Explicit for Livewire assets
    location /livewire {
        try_files $uri $uri/ /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Dedicated handling for Livewire dynamic endpoints
    location = /livewire/update {
        if ($request_method != POST) {
            return 405 "Method Not Allowed - /livewire/update must use POST";
        }
        try_files /dev/null /index.php?$query_string;
    }

    location = /livewire/upload-file {
        if ($request_method != POST) {
            return 405 "Method Not Allowed";
        }
        try_files /dev/null /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Forwarded headers (important for Laravel to know it's HTTPS)
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;

        fastcgi_param HTTP_X_CSRF_TOKEN $http_x_csrf_token;

        fastcgi_param HTTPS on;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }
}

# HTTPS редирект для голого домена (пока сертификат не покрывает голой домен — при первом заходе будет предупреждение о имени сертификата)
server {
    listen 443 ssl;
    http2 on;
    server_name xn---15-7edz.xn--p1ai;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    return 301 https://www.xn---15-7edz.xn--p1ai$request_uri;
}
