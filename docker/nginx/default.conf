# =============================================
# HTTP server (currently primary — no SSL certs yet)
# This block serves the Laravel application.
# IMPORTANT: Without this, you see only nginx default welcome page.
# =============================================
server {
    listen 80 default_server;
    server_name _ тч-15.рф www.тч-15.рф xn---15-7edz.xn--p1ai www.xn---15-7edz.xn--p1ai;

    # Critical for Livewire / Filament file uploads (large POST bodies)
    client_max_body_size 100M;

    index index.php index.html;
    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets (images, css, js) — improves speed
    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;  # don't spam error log for missing images (carousel placeholders etc.)
    }

    # PHP-FPM (app container) — Livewire update + all dynamic requests
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Currently plain HTTP
        fastcgi_param HTTPS off;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Better buffering for large Filament/Livewire responses (reduces "buffered to temp file" warnings)
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }
}

