# docker-compose.prod.yml
# Production-ready configuration for ARM (тч-15)
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # Основное приложение (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arm-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://xn---15-7edz.xn--p1ai}
      # HTTPS is active. Session cookies must be secure.
      # Setting to true prevents cookies from being sent over HTTP and fixes 419 on POSTs (login, device registration, Livewire) for new users.
      - SESSION_SECURE_COOKIE=true
      - SESSION_SAME_SITE=lax
      - SESSION_LIFETIME=120
      # IMPORTANT: Do NOT force SESSION_DOMAIN or SESSION_DRIVER here unless you know what you are doing.
      # Changing them invalidates active browser cookies/sessions and causes 419 loops on login and Livewire.
      # Leave to your .env (or set empty).
      - SESSION_DOMAIN=
      # If you previously forced database and have 419 loops, clear your browser cookies for the domain after deploy.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'OK';"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Веб-сервер (Nginx) — единственный с открытыми портами
  nginx:
    image: nginx:stable-alpine
    container_name: arm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (required now)
      - ./ssl:/etc/nginx/ssl:ro
      # Alternative if you use certbot on the host:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: arm-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ClickHouse (аналитика и история нормативов)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: arm-clickhouse
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    # Порты закрыты для продакшена
    networks:
      - backend

  # MinIO (S3-хранилище документов)
  minio:
    image: minio/minio:latest
    container_name: arm-minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_SERVER_URL: "http://minio:9000"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # Консоль MinIO не открыта нарушу
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Meilisearch (поиск)
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: arm-meilisearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
    volumes:
      - meilisearch_data:/meili_data
    # Порт закрыт для продакшена
    networks:
      - backend

  # Redis (кэш, сессии, очереди)
  redis:
    image: redis:alpine
    container_name: arm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend

# ==================== СЕТИ ====================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

# ==================== VOLUMES ====================
volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
  meilisearch_data:
  redis_data:
  app_storage: